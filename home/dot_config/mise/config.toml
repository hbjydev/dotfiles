[settings]
experimental = true
verbose = false
jobs = 4
raw = false
pipx.uvx = true
python.uv_venv_auto = true
auto_env = true

[env]
CLOUDSDK_PYTHON = { value = "{{ tools.python.path }}/bin/python3", tools = true }

[bootstrap.brew]
adopt = true

[bootstrap.packages]
"brew:findutils" = "latest"
"brew:forgejo-cli" = "latest"
"brew:git" = "latest"
"brew:gnu-getopt" = "latest"
"brew:sequoia-sq" = "latest"
"brew:tree-sitter" = "latest"
"brew:tree-sitter-cli" = "latest"
"brew:w3m" = "latest"

# macos-only
"brew-cask:1password" = "latest"
"brew-cask:1password-cli" = "latest"
"brew-cask:discord" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:keymapp" = "latest"
"brew-cask:raycast" = "latest"
"brew-cask:spotify" = "latest"
"brew-cask:visual-studio-code" = "latest"

[bootstrap.services.colima]
scope = "user"
command = "colima start -f"
restart = "on-failure"
enabled = true

[tools]
# languages
node = "latest"
fnox = "latest"
pitchfork = "latest"
uv = "0.12.18"
python = "3.14.7"

# dev tooling
codex = "0.159.2"
opencode = "1.18.32"
"github:can1357/oh-my-pi" = "latest"
gcloud = "585.0.0"
"github:perfectra1n/fjo" = "v0.2.5"
act = "0.2.89"
age = "1.3.2"
atuin = "18.23.0"
aws-cli = "2.37.0"
bat = "0.26.1"
chezmoi = "2.72.2"
difftastic = "0.71.0"
eza = "0.23.5"
github-cli = "2.101.0"
jj = "0.45.1"
jq = "1.8.2"
lazygit = "0.65.1"
neovim = "0.12.5"
pi = "0.87.1"
ripgrep = "15.2.0"
sops = "3.13.3"
starship = "1.26.0"
viddy = "1.3.1"
zellij = "0.45.1"
delta = "0.19.2"

# containers
kubectl = "1.37.0"
colima = "0.10.3"
docker-cli = "29.8.1"
docker-compose = "5.5.1"
"github:docker/buildx" = { version = "v0.37.1", rename_exe = "docker-buildx" }
lima = "2.2.0"
trivy = "0.74.0"
helm = "4.3.0"
"github:nklmilojevic/sofka" = "0.28.5"
"aqua:kubernetes-sigs/krew" = "0.5.0"
"aqua:kubernetes-sigs/kustomize" = "5.8.1"

# other
"pipx:tiddl" = "latest"
"aqua:asciinema/asciinema" = "latest"
"aqua:asciinema/agg" = "latest"

# vim:ft=toml
