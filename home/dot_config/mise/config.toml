[settings]
experimental = true
verbose = false
jobs = 4
raw = false
pipx.uvx = true
python.uv_venv_auto = true
auto_env = true

[env]
CLOUDSDK_PYTHON = { value = "{{ tools.python.path }}/bin/python3", tools = true }

[bootstrap.brew]
adopt = true

[bootstrap.packages]
"brew:findutils" = "latest"
"brew:git" = "latest"
"brew:gnu-getopt" = "latest"
"brew:sequoia-sq" = "latest"
"brew:tree-sitter" = "latest"
"brew:tree-sitter-cli" = "latest"

# macos-only
"brew-cask:1password" = "latest"
"brew-cask:1password-cli" = "latest"
"brew-cask:discord" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:keymapp" = "latest"
"brew-cask:raycast" = "latest"
"brew-cask:spotify" = "latest"
"brew-cask:visual-studio-code" = "latest"

[bootstrap.services.colima]
scope = "user"
command = "colima start -f"
restart = "on-failure"
enabled = true

[tools]
# languages
node = "latest"
fnox = "latest"
pitchfork = "latest"
uv = "0.13.6"
python = "3.15.2"

# dev tooling
herdr = "0.9.5"
codex = "0.159.2"
opencode = "2.2.0"
"github:can1357/oh-my-pi" = "latest"
gcloud = "585.0.0"
"github:perfectra1n/fjo" = "v0.2.6"
act = "0.2.89"
age = "1.3.2"
atuin = "18.24.2"
aws-cli = "2.38.6"
bat = "0.26.1"
chezmoi = "2.73.3"
difftastic = "0.71.0"
eza = "0.23.5"
github-cli = "2.103.3"
jj = "0.46.0"
jq = "1.8.2"
lazygit = "0.66.3"
neovim = "0.12.6"
pi = "1.4.0"
ripgrep = "15.2.0"
sops = "3.13.3"
starship = "1.27.0"
viddy = "1.3.1"
zellij = "0.45.1"
delta = "0.20.1"

# containers
kubectl = "1.37.1"
colima = "0.10.3"
docker-cli = "29.9.2"
docker-compose = "5.6.1"
"github:docker/buildx" = { version = "v0.38.1", rename_exe = "docker-buildx" }
lima = "2.2.1"
trivy = "0.76.1"
helm = "4.3.1"
"github:nklmilojevic/sofka" = "0.32.0"
"aqua:kubernetes-sigs/krew" = "0.5.0"
"aqua:kubernetes-sigs/kustomize" = "5.8.1"

# other
"pipx:tiddl" = "latest"
"aqua:asciinema/asciinema" = "latest"
"aqua:asciinema/agg" = "latest"

# vim:ft=toml
